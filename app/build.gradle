plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
}

// 获取打包时间，精确到小时
def buildTime = new Date().format("yyyyMMddHH", TimeZone.getTimeZone("Asia/Shanghai"))

android {
    signingConfigs {
        debug {
            // Debug和Release使用相同签名 (从上级目录加载)
            keyAlias 'android'
            keyPassword 'android'
            storeFile project.rootProject.file('../keystore.jks')
            storePassword 'android'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
        release {
            // Release使用与Debug相同的签名 (从上级目录加载)
            keyAlias 'android'
            keyPassword 'android'
            storeFile project.rootProject.file('../keystore.jks')
            storePassword 'android'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }
    compileSdk 34

    defaultConfig {
        applicationId "com.shijing.xomniclaw"
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName "1.0.19"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 启用 multiDex for test APK
        multiDexEnabled true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            // 完全关闭混淆和压缩 - 不使用proguardFiles

            // Release版本配置标记
            buildConfigField 'Boolean', 'IS_SYSTEM_APP', 'true'
            buildConfigField 'String', 'BUILD_VARIANT', '"release"'
            buildConfigField 'Boolean', 'SKIP_PERMISSION_REQUEST', 'false'  // Release版本正常请求权限
            
            // 使用release版本的AndroidManifest（具有systemuid）
            manifestPlaceholders = [
                useSystemUid: "true",
                appName: "@string/app_name",
                buildType: "release"
            ]
        }

        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug

            // Debug版本配置标记
            buildConfigField 'Boolean', 'IS_SYSTEM_APP', 'false'
            buildConfigField 'String', 'BUILD_VARIANT', '"debug"'
            buildConfigField 'Boolean', 'SKIP_PERMISSION_REQUEST', 'true'  // Debug版本跳过权限请求页面

            // 使用debug版本的AndroidManifest（不使用systemuid）
            manifestPlaceholders = [
                useSystemUid: "false",
                appName: "@string/app_name",
                buildType: "debug"
            ]
            // 移除 applicationIdSuffix，debug 和 release 使用相同包名
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }


    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE.md',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }

    buildFeatures {
        viewBinding true
        compose true
        aidl = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.4.6"  // 匹配 Kotlin 1.8.20
    }

    namespace 'com.shijing.xomniclaw'

    // 配置 APK 输出路径到根目录的 releases/
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                // 生成文件名: CareClaw-v1.0.0-release.apk
                def fileName = "CareClaw-v${defaultConfig.versionName}-${variant.buildType.name}.apk"

                // 输出到项目根目录的 releases/
                def releasesDir = project.rootProject.file("releases")
                releasesDir.mkdirs()

                // 设置输出文件
                outputFileName = fileName

                // 复制到 releases 目录
                variant.assemble.doLast {
                    copy {
                        from output.outputFile
                        into releasesDir
                        rename { fileName }
                    }
                    println "✅ APK copied to: ${releasesDir}/${fileName}"
                }
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.tencent:mmkv-static:1.3.1'

    // ========== EasyFloat 悬浮窗 ==========
    implementation 'com.github.princekin-f:EasyFloat:2.0.4'

    // ========== Jetpack Compose 依赖 (匹配 Kotlin 1.8.20) ==========
    def compose_version = "1.4.3"
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.material3:material3:1.1.0"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation "androidx.activity:activity-compose:1.7.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1"
    implementation "androidx.compose.material:material-icons-extended:$compose_version"
    implementation "androidx.compose.foundation:foundation:$compose_version"

    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"

    // Gson（JSON 序列化；此前经飞书 SDK 传递引入，L2 删飞书后需显式声明）
    implementation 'com.google.code.gson:gson:2.10.1'

    // 单元测试（app/src/test 唯一单测依赖；无 androidTest 目录，测试依赖已全部移除）
    testImplementation 'junit:junit:4.13.2'
}

// L2 精简：飞书 SDK 已删除，此前的 configurations 排除块一并移除。
